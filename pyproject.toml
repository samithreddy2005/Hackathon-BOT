[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-resume-bot"
version = "1.0.0"
description = "Telegram bot that scores resumes against job descriptions with a local, offline-first ATS engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "K. Samith Reddy" }]
keywords = ["telegram", "bot", "ats", "resume", "recruiting", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # job-queue extra powers the periodic purge of expired uploads.
    "python-telegram-bot[job-queue]>=21.0,<23.0",
    "python-dotenv>=1.0,<2.0",
    "pdfplumber>=0.11,<0.12",
    "python-docx>=1.1,<2.0",
    "pytesseract>=0.3.10,<0.4",
    "Pillow>=10.0,<13.0",
    "rapidfuzz>=3.0,<4.0",
]

[project.optional-dependencies]
llm = ["groq>=0.11,<2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "types-pytz",
]

[project.scripts]
ats-bot = "ats_bot.__main__:main"

[project.urls]
Homepage = "https://github.com/samithreddy/ATS-Telegram-Bot"
Issues = "https://github.com/samithreddy/ATS-Telegram-Bot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ats_bot = ["db/schema.sql", "py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by black
    "RUF001", # ambiguous unicode in strings (emoji and box-drawing are intentional)
    "RUF002",
    "RUF003",
    "SIM905", # word lists are far more readable as a triple-quoted string .split()
]

[tool.ruff.lint.per-file-ignores]
# Test doubles use plain class attributes to stand in for library objects; the
# mutable-default warning does not apply to throwaway fakes.
"tests/*" = ["B011", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["ats_bot"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:ats_bot.*"]

[tool.coverage.run]
source = ["src/ats_bot"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
